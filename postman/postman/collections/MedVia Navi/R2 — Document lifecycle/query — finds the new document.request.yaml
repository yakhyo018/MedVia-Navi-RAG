$kind: http-request
url: "{{naviUrl}}/v1/query"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: '{{naviKey}}'
body:
  type: json
  content: |-
    {
      "question": "How many working days does the clinic need to send a medical invitation letter?"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();

      const sources = body.sources || [];
      console.log('ANSWER:', body.answer);
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('the test document is among the sources', () =>
        pm.expect(sources.map(s => s.doc_id), JSON.stringify(sources.map(s => [s.doc_id, s.score]))).to.include('postman-test-invitation-letter'));
      pm.test('no invalid citations', () => pm.expect(body.invalid_citations).to.eql([]));
    language: text/javascript
order: 5000
