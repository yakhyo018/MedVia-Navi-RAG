$kind: http-request
url: "{{naviUrl}}/v1/documents/postman-test-invitation-letter"
method: DELETE
headers:
  X-API-Key: '{{naviKey}}'
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();

      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('removed chunks > 0', () => pm.expect(body.chunks).to.be.above(0));
    language: text/javascript
order: 6000
