$kind: http-request
url: "{{naviUrl}}/v1/documents"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: '{{naviKey}}'
body:
  type: json
  content: |-
    {
      "documents": [
        {
          "doc_id": "postman-test-invitation-letter",
          "title": "Postman test — invitation letter",
          "source_type": "guide",
          "lang": "EN",
          "text": "# Postman test — invitation letter\n\nMedVia itself does not issue visa invitation letters. After a booking is confirmed, the clinic sends a medical invitation letter within 3 working days."
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();

      const item = (body.items && body.items[0]) || {};
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('status indexed (unchanged = a previous run did not clean up)', () => pm.expect(item.status).to.eql('indexed'));
      pm.test('at least one chunk', () => pm.expect(item.chunks).to.be.above(0));
    language: text/javascript
order: 1000
