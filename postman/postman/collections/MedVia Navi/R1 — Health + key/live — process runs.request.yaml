$kind: http-request
url: "{{naviUrl}}/health/live"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();

      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('status ok', () => pm.expect(body.status).to.eql('ok'));
      pm.test('liveness does not report Qdrant', () => pm.expect(body.qdrant).to.be.oneOf([null, undefined]));
    language: text/javascript
order: 1000
