$kind: http-request
url: "{{naviUrl}}/v1/ping"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('WWW-Authenticate: ApiKey', () => pm.expect(pm.response.headers.get('WWW-Authenticate')).to.eql('ApiKey'));
    language: text/javascript
order: 3000
